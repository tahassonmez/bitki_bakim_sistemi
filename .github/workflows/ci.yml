name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bitki
          POSTGRES_PASSWORD: bitki_test_password
          POSTGRES_DB: bitki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bitki:bitki_test_password@localhost:5432/bitki_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 8h
      API_PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @hr/api exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: pnpm --filter @hr/api lint

      - name: Apply migrations
        run: pnpm --filter @hr/api exec prisma migrate deploy

      - name: Seed test database
        run: pnpm --filter @hr/api exec prisma db seed

      - name: Unit tests
        run: pnpm --filter @hr/api test

      - name: End-to-end tests
        run: pnpm --filter @hr/api test:e2e

      - name: Build
        run: pnpm --filter @hr/api build
